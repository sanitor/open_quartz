[package]
name = "open_quartz_execution"
version = "0.19.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[features]
default = []
native-video-d3d12 = ["dep:ffmpeg-next"]

[dependencies]
open_quartz_schema = { path = "../open_quartz_schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
naga = { version = "27", features = ["wgsl-in"] }
regex = "1.12"
futures-channel = "0.3"
wgpu = { version = "27", default-features = false, features = ["wgsl", "webgpu", "gles", "vulkan", "dx12", "metal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-graphics = { package = "windows", version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = ["codec", "format"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = ["ImageBitmap", "OffscreenCanvas"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
