[package]
name = "slint_code_editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false
readme = "README.md"

[workspace]

[features]
ui-automation = ["slint/mcp"]

[dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
cosmic-text = { version = "=0.18.2", default-features = false, features = ["std", "swash"] }
arboard = { version = "3.7", default-features = false }
unicode-segmentation = "1.12"

[build-dependencies]
slint-build = "=1.18.1"
