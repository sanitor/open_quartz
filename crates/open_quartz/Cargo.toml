[workspace]
members = ["."]
resolver = "2"

[package]
name = "open_quartz"
version = "0.18.0"
edition = "2021"
rust-version = "1.77.2"
description = "Rust SDK for the OpenQuartz realtime heterogeneous video pipeline"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
naga = { version = "27", features = ["wgsl-in"] }
regex = "1.12"
futures-channel = "0.3"
wgpu = { version = "27", default-features = false, features = ["wgsl", "webgpu", "gles", "vulkan", "dx12", "metal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }

[target.'cfg(windows)'.dependencies]
windows-graphics = { package = "windows", version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
