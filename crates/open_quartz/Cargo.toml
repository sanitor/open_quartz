
[package]
name = "open_quartz"
version = "0.19.0"
edition = "2021"
rust-version = "1.77.2"
description = "Rust SDK for the OpenQuartz realtime heterogeneous video pipeline"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native-video-d3d12 = ["open_quartz_execution/native-video-d3d12"]

[dependencies]
open_quartz_execution = { path = "../open_quartz_execution" }
open_quartz_host_api = { path = "../open_quartz_host_api" }
open_quartz_sdk = { path = "../open_quartz_sdk" }
open_quartz_schema = { path = "../open_quartz_schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
web-sys = { version = "0.3", features = ["ImageBitmap", "OffscreenCanvas"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
