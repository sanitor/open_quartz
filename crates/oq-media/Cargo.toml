[package]
name = "oq-media"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.92"
publish = false
description = "Framework-independent media frames and native VideoToolbox decoding"

[features]
default = []
audio = ["dep:ffmpeg-next"]
videotoolbox = ["audio"]

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
ffmpeg-next = { version = "9", optional = true, default-features = false, features = ["codec", "format", "software-resampling"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "decode"
required-features = ["videotoolbox"]
