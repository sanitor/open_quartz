[package]
name = "oq-inference"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Independent named tensor inference contracts and ONNX Runtime execution"
license = "MIT"

[features]
default = []
ort = ["dep:ort", "dep:sha2"]
gpu = ["dep:wgpu", "dep:sha2"]

[dependencies]
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "metal", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "load-dynamic", "api-21", "coreml"] }

[dev-dependencies]
serde_json = "1"
pollster = "0.4"

[[example]]
name = "coreml_compare"
required-features = ["ort"]

[[example]]
name = "resident_compare"
required-features = ["gpu", "ort"]
