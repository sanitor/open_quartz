[package]
name = "open_quartz_screensaver"
version = "0.20.0"
edition = "2021"
rust-version = "1.92"
description = "Framework-neutral Windows screen saver package export for OpenQuartz"
license = "MIT"

[dependencies]
open_quartz = { path = "../open_quartz", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
