[package]
name = "app"
version = "0.19.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.12", features = ["stream"] }
regex = "1.12"
futures = "0.3"
tokio = { version = "1", features = ["fs", "sync"] }
tauri = { version = "2.11.3", features = ["protocol-asset", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
open_quartz = { path = "../crates/open_quartz" }
open_quartz_execution = { path = "../crates/open_quartz_execution", features = ["native-video-d3d12"] }
open_quartz_schema = { path = "../crates/open_quartz_schema" }
pollster = "0.4"
wgpu = { version = "27", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging"] }
