name: Desktop hardware parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware-preview:
    name: Native desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: '["macos-latest"]'
          - platform: Windows
            runner: '["self-hosted","Windows","X64","openquartz-video-gpu"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Configure Windows bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'

      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:desktop:export
      - run: npm run test:e2e:full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-parity-${{ matrix.platform }}
          path: |
            test-results/slint-ui/
            test-results/phase6/
            test-results/clip-pipeline/
            test-results/inference-e2e/
            test-results/phase5/
          if-no-files-found: warn
