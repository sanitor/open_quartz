name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rust-sdk-coverage:
    name: Rust SDK Coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Linux GPU runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvulkan1 mesa-vulkan-drivers

      - name: Install dependencies
        run: npm ci

      - name: Prepare native desktop runtimes
        run: npm run prepare:desktop

      - name: Configure Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "FFMPEG_DIR=$pwd\apps\open_quartz_slint\runtime\ffmpeg-shared" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$pwd\node_modules\.cache\open-quartz\desktop-runtime-win32-x64" >> $env:GITHUB_PATH

      - name: Enforce 100% Rust SDK coverage
        run: npm run test:sdk-coverage

  media-source-window:
    name: Native media source and hardware export (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm ci
      - run: npm run prepare:desktop
      - name: Exercise real VideoToolbox source and export contracts
        env:
          OPEN_QUARTZ_FFMPEG_PATH: ${{ github.workspace }}/apps/open_quartz_slint/runtime/ffmpeg
        run: |
          mkdir -p test-results/phase5
          cargo llvm-cov --locked -p oq-media --features videotoolbox --json --output-path test-results/phase5/media-coverage.json -- --test-threads=1
          cargo test --locked -p open_quartz --features native-runtime,native-video --lib -- --test-threads=1
          cargo run --locked -p open_quartz --features native-runtime,native-video --example export_video -- crates/oq-media/tests/source-time.mp4 test-results/phase5/cli-export.mp4 1 13 10 1 --invert
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-source-and-export-evidence
          path: test-results/phase5/
          if-no-files-found: error

  video-editor:
    name: Native video editor (macOS)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm ci
      - name: Exercise Rust and real editor UI with coverage
        run: npm run test:video-editor:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-video-editor-evidence
          path: test-results/phase6/
          if-no-files-found: error

  slint-app:
    name: Slint desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop and GPU dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libvulkan1 mesa-vulkan-drivers xvfb

      - name: Configure Windows bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'

      - run: npm ci

      - name: Test reusable code editor
        run: npm run test:editor

      - name: Test native desktop (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

      - name: Test native desktop
        if: runner.os != 'Linux'
        run: npm run test:desktop

      - name: Test desktop UI (Linux Vulkan virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:ui

      - name: Test desktop UI (macOS native window)
        if: runner.os == 'macOS'
        run: npm run test:desktop:ui

      - name: Test all catalog shaders with image fixtures (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop:shaders

      - name: Test all catalog shaders with image fixtures (macOS)
        if: runner.os == 'macOS'
        run: npm run test:desktop:shaders

      - name: Build desktop UI automation (Windows compile coverage)
        if: runner.os == 'Windows'
        run: npm run build:desktop:ui

      - name: Upload desktop UI screenshots and diagnostics
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: slint-ui-${{ matrix.os }}
          path: test-results/slint-ui/
          if-no-files-found: warn

      - name: Build and package native desktop
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: slint-desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.zip
            dist-desktop/*.tar.gz
          if-no-files-found: error
