[package]
name = "open_quartz_video_editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "MIT"
description = "Native non-destructive video editor for OpenQuartz"

[workspace]

[features]
ui-automation = ["slint/mcp"]

[dependencies]
base64 = "0.22"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
cosmic-text = { version = "=0.18.2", default-features = false, features = ["std", "swash"] }
open_quartz = { path = "../../crates/open_quartz", features = ["native-runtime", "native-video", "model-cache"] }
slint_code_editor = { path = "../../crates/slint_code_editor" }
slint = { version = "=1.18.1", features = ["renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan"] }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
rfd = "0.16"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
oq-media = { path = "../../crates/oq-media", features = ["videotoolbox"] }

[target.'cfg(windows)'.dependencies]
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
i-slint-core = { version = "=1.18.1", default-features = false }
open_quartz = { path = "../../crates/open_quartz", features = ["native-video-precise-d3d12", "native-dml"] }
oq-media = { path = "../../crates/oq-media", features = ["audio"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.wgpu-core]
debug-assertions = false
